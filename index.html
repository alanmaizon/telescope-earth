<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earth</title>
  <style>
    :root {
      --bg: #030712;
      --bg-2: #08182d;
      --glow: rgba(82, 161, 255, 0.45);
      --blue: #5ec4ff;
      --ocean: #0f6fdd;
      --ocean-2: #0a4ea6;
      --land: #7ad97a;
      --land-2: #3fb06f;
      --text: #eef6ff;
      --muted: rgba(238, 246, 255, 0.75);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, var(--bg-2) 0%, var(--bg) 45%, #01050b 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .scene {
      position: relative;
      width: min(92vw, 1000px);
      height: min(92vh, 760px);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .stars, .stars::before, .stars::after {
      content: "";
      position: absolute;
      inset: -15%;
      background-repeat: repeat;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 0 1.5px, transparent 2px),
        radial-gradient(circle, rgba(160,200,255,0.8) 0 1.2px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 1.3px);
      background-size: 180px 180px;
      background-position: 0 0, 75px 35px, 35px 110px;
      opacity: 0.9;
      animation: drift 22s linear infinite;
    }

    .stars::before {
      transform: scale(1.2);
      opacity: 0.55;
      animation-duration: 26s;
    }

    .stars::after {
      transform: scale(1.5);
      opacity: 0.4;
      animation-duration: 31s;
    }

    .earth-shell {
      position: relative;
      width: min(54vw, 420px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      animation: float 6s ease-in-out infinite;
    }

    .earth-glow {
      position: absolute;
      width: 105%;
      height: 105%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(90, 201, 255, 0.7) 0%, rgba(90, 201, 255, 0.18) 35%, rgba(90, 201, 255, 0) 70%);
      filter: blur(26px);
    }

    .earth {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 30%, rgba(164, 225, 255, 0.9) 0 8%, transparent 9%),
        radial-gradient(circle at 30% 30%, #c8f4ff 0%, #83d0ff 10%, #2a88d8 20%, #0d5eae 40%, #0a2e67 60%, #06192f 100%);
      box-shadow:
        inset -30px -35px 55px rgba(0, 0, 0, 0.52),
        inset 18px 18px 32px rgba(180, 235, 255, 0.25),
        0 0 40px rgba(76, 161, 255, 0.35);
      overflow: hidden;
      animation: spin 18s linear infinite;
    }

    .earth::before,
    .earth::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .earth::before {
      background:
        radial-gradient(circle at 20% 40%, rgba(48, 173, 92, 0.9) 0 7%, transparent 7.5%),
        radial-gradient(circle at 35% 50%, rgba(41, 157, 89, 0.9) 0 9%, transparent 9.5%),
        radial-gradient(circle at 53% 62%, rgba(46, 162, 82, 0.95) 0 10%, transparent 10.5%),
        radial-gradient(circle at 72% 48%, rgba(44, 169, 92, 0.9) 0 8%, transparent 8.5%),
        radial-gradient(circle at 68% 36%, rgba(30, 126, 68, 0.8) 0 7%, transparent 7.5%),
        radial-gradient(circle at 50% 25%, rgba(49, 179, 92, 0.85) 0 8%, transparent 8.8%);
      mix-blend-mode: multiply;
      opacity: 0.95;
    }

    .earth::after {
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.08) 2px,
        transparent 2px,
        transparent 4px
      );
      transform: rotate(12deg);
      opacity: 0.35;
    }

    .orbit {
      position: absolute;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50%;
      inset: 11%;
      transform: rotateX(70deg);
    }

    .orbit:nth-of-type(2) {
      inset: 18%;
    }

    .title-block {
      position: absolute;
      left: 50%;
      bottom: 115px;
      transform: translateX(-50%);
      text-align: center;
      z-index: 2;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 4vw, 4.5rem);
      letter-spacing: -0.06em;
      font-weight: 700;
    }

    .link-card {
      position: absolute;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem 1.4rem;
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 35px rgba(0,0,0,0.28);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      font-size: 0.96rem;
      letter-spacing: 0.03em;
      z-index: 2;
    }

    .link-card:hover {
      transform: translateX(-50%) translateY(-2px);
      background: rgba(255,255,255,0.12);
      border-color: rgba(125, 198, 255, 0.8);
    }

    @keyframes spin {
      0% { background-position: 0 0; }
      100% { background-position: 1000px 0; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-12px, 18px, 0) scale(1.18); }
      to { transform: translate3d(0, 0, 0) scale(1); }
    }

    @media (max-width: 640px) {
      .scene {
        width: 100vw;
        height: 100vh;
      }

      .earth-shell {
        width: min(72vw, 300px);
      }

      .title-block {
        bottom: 100px;
      }

      .link-card {
        width: min(80vw, 320px);
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Earth feature scene">
    <div class="stars" aria-hidden="true"></div>

    <div class="earth-shell" aria-label="Spinning Earth">
      <div class="earth-glow" aria-hidden="true"></div>
      <div class="earth" aria-hidden="true"></div>
      <div class="orbit" aria-hidden="true"></div>
      <div class="orbit" aria-hidden="true"></div>
    </div>

    <div class="title-block">
      <p class="eyebrow">Planetary focus</p>
      <h1>Earth</h1>
    </div>

    <a class="link-card" href="./2.html">
      See the complete solar system
    </a>
  </main>
</body>
</html>
