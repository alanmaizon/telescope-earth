<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Explorer | Telescope</title>
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="back-link" href="./index.html">&larr; Cosmic Scale</a>
        <div class="title-block">
            <p class="eyebrow">Interactive model</p>
            <h1>SOLAR SYSTEM</h1>
        </div>
        <div class="scene-actions">
            <button id="xrButton" type="button" disabled>Check XR</button>
            <button id="fullscreenButton" type="button">Fullscreen</button>
            <p id="sceneStatus" class="scene-status">Drag to orbit &middot; Scroll to zoom &middot; Select a planet</p>
        </div>
    </header>

    <main id="app" aria-label="Interactive solar system model"></main>

    <aside id="sidebar" aria-labelledby="planetName" aria-hidden="true">
        <button id="closeButton" type="button" aria-label="Close planet details">&times;</button>
        <h2 id="planetName"></h2>
        <p id="planetInfo"></p>
        <img id="planetGif" src="" alt="" />
        <table id="planetDetails">
            <caption>Planet data</caption>
            <tbody></tbody>
        </table>
    </aside>

    <script src="./static/js/three.min.js"></script>
    <script src="./static/js/GLTFLoader.js"></script>
    <script src="./static/js/OrbitControls.js"></script>
    <script src="./static/js/script.js"></script>
</body>
</html>
